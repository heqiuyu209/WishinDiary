services:
  backend:
    image: ghcr.io/heqiuyu209/wishindiary-backend:${IMAGE_TAG:?IMAGE_TAG is required}
  frontend:
    image: ghcr.io/heqiuyu209/wishindiary-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
  reminders:
    image: ghcr.io/heqiuyu209/wishindiary-backend:${IMAGE_TAG:?IMAGE_TAG is required}
