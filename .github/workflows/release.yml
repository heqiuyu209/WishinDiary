# Release 工作流：推送 v* 标签时触发，生成 changelog 与发布资产。
#
# 版本标签规范（语义化版本）：
#   - vMAJOR.MINOR.PATCH         例如 v1.0.0
#   - vMAJOR.MINOR.PATCH-rc.N    预发布候选，例如 v1.1.0-rc.1
# 每次正式发布应同步完成：
#   1. CHANGELOG 更新；
#   2. 数据库迁移版本号确认（alembic heads）；
#   3. 官方演示基线模型（纯合成数据）由 CI 在本工作流内用 wishindiary-api/scripts/train.py --synthetic-only
#      生成，并作为 Release 资产随版本发布（*.skops 不入 git 历史，仅在 Release 中供下载）。
#      使用者下载后以 sha256 校验，并将哈希写入 MODEL_SHA256。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-rel-${{ github.run_id }}
          MYSQL_DATABASE: wishindiary_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-rel-${{ github.run_id }}
      DB_NAME: wishindiary_test_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wishindiary-api/requirements-dev.txt

      - name: Set up Node.js 22.18
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
          cache-dependency-path: Wishindiary-web/package-lock.json

      - name: Verify backend build & tests
        working-directory: ./wishindiary-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check app scripts tests
          python -m pytest

      - name: Build demo baseline model (synthetic)
        # 生成纯合成"演示基线"模型（不读真实用户库），作为 Release 资产随版本发布。
        # 仅供开箱即用演示，不宣称任何真实预测准确率；SHA-256 见 MODEL_CARD.md。
        working-directory: ./wishindiary-api
        run: python scripts/train.py --synthetic-only

      - name: Verify frontend build
        working-directory: ./Wishindiary-web
        run: |
          npm ci
          npm run type-check
          npm run build

      - name: Generate Changelog
        run: |
          # Changelog：取上一版本 tag 到当前 tag（当前推送标签）的提交区间
          CURRENT_TAG="${{ github.ref_name }}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)
          {
            echo "## WishinDiary Changelog"
            echo ""
            echo "### ${CURRENT_TAG} ($(date -u +%Y-%m-%d))"
            echo ""
            if [ -n "$PREVIOUS" ]; then
              echo "#### Commits since ${PREVIOUS}"
            else
              echo "#### Commits（首个标签，无上一版本）"
            fi
            echo ""
            if [ -n "$PREVIOUS" ]; then
              git log --oneline --no-merges "${PREVIOUS}..${CURRENT_TAG}" 2>/dev/null | sed 's/^/- /' || echo "- no new commits"
            else
              git log --oneline --no-merges "${CURRENT_TAG}" 2>/dev/null | sed 's/^/- /' || echo "- initial release"
            fi
          } > CHANGELOG_RELEASE.md

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.4
        with:
          path: ./
          format: spdx
          output-file: sbom.spdx.json

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_RELEASE.md
          draft: ${{ contains(github.ref_name, '-rc.') }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          fail_on_unmatched_files: true
          files: |
            CHANGELOG_RELEASE.md
            sbom.spdx.json
            wishindiary-api/requirements.txt
            wishindiary-api/migrations/versions/*.py
            MODEL_CARD.md
            wishindiary-api/ml/menstrual_rf_model.skops
