name: Publish Docker images

on:
  push:
    branches: [main, master, codex/personal-cycle-research]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      ENVIRONMENT: test
      SECRET_KEY: synthetic-image-check-key-for-ci-only
      SMTP_HOST: ""
      SMTP_FROM: ""
      SENTRY_DSN: ""
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wishindiary-api/requirements.txt

      - name: Generate a synthetic demo model
        id: model
        working-directory: wishindiary-api
        run: |
          python -m pip install -r requirements.txt
          python scripts/train.py --synthetic-only
          echo "sha256=$(sha256sum ml/menstrual_rf_model.skops | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "pipeline=$(python -c 'from app.ml.lifestyle_report import lifestyle_pipeline_fingerprint; print(lifestyle_pipeline_fingerprint())')" >> "$GITHUB_OUTPUT"

      - name: Build both images
        env:
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.wishindiary.model.sha256=$MODEL_SHA256" \
            --tag wishindiary-backend:check wishindiary-api
          docker build --pull --build-arg VITE_API_BASE_URL=/ \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag wishindiary-frontend:check Wishindiary-web

      - name: Verify containers with an isolated database
        env:
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
          EXPECTED_PIPELINE: ${{ steps.model.outputs.pipeline }}
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/wishindiary-image-check.env"
          override_file="$RUNNER_TEMP/wishindiary-image-check.yml"
          umask 077
          {
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "DB_PASSWORD=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "DB_USER=image_check"
            echo "DB_NAME=wishindiary_image_check"
            echo "MODEL_SHA256=$MODEL_SHA256"
            echo "ALLOW_INSECURE_HTTP=true"
            echo "WEB_BIND_HOST=127.0.0.1"
            echo "WEB_PORT=18080"
            echo "API_PORT=18000"
            echo "CORS_ORIGINS=http://127.0.0.1:18080"
            echo "SMTP_HOST="
            echo "SMTP_FROM="
          } > "$env_file"
          cat > "$override_file" <<'YAML'
          services:
            backend:
              image: wishindiary-backend:check
            frontend:
              image: wishindiary-frontend:check
          YAML
          compose=(docker compose --project-name wishindiary-image-check --env-file "$env_file" -f docker-compose.yml -f "$override_file")
          cleanup() {
            "${compose[@]}" logs --no-color --tail=60 backend frontend
            "${compose[@]}" down --volumes --remove-orphans
            rm -f "$env_file" "$override_file"
          }
          trap cleanup EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" up --detach --no-build --wait --wait-timeout 180 db backend frontend
          curl --fail --silent http://127.0.0.1:18080/ | grep -q '<div id="app">'
          curl --fail --silent http://127.0.0.1:18080/api/health | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] == "ok" and data["database"] == "connected"; print("Nginx to API to MySQL: passed")'
          "${compose[@]}" exec -T -e EXPECTED_PIPELINE="$EXPECTED_PIPELINE" backend python -c 'import os; from pathlib import Path; from app.ml.lifestyle_report import lifestyle_pipeline_fingerprint; assert os.getuid() != 0; assert Path("scripts/lifestyle_backtest.py").is_file(); assert lifestyle_pipeline_fingerprint() == os.environ["EXPECTED_PIPELINE"]; print("Non-root runtime and research pipeline fingerprint: passed")'
          "${compose[@]}" exec -T backend python -m pip check
          "${compose[@]}" exec -T backend alembic current

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify remote manifests
        env:
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch_tag=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_.-]/-/g' | cut -c 1-128)
          tags=("sha-$GITHUB_SHA" "$branch_tag")
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            tags+=(latest)
          fi
          for component in backend frontend; do
            image="$image_prefix-$component"
            for tag in "${tags[@]}"; do
              docker tag "wishindiary-$component:check" "$image:$tag"
              docker push "$image:$tag"
            done
            docker manifest inspect "$image:sha-$GITHUB_SHA" > "$RUNNER_TEMP/$component-manifest.json"
            echo "- Image: \`$image:$branch_tag\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit tag: \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- Revision: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synthetic demo MODEL_SHA256: \`$MODEL_SHA256\`" >> "$GITHUB_STEP_SUMMARY"
