name: WishinDiary CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          MYSQL_DATABASE: wishindiary_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: ./wishindiary-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend import smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci-root-${{ github.run_id }}
          DB_NAME: wishindiary_test_db
        run: python -c "from app.main import app; print(app.title)"

      - name: Lint backend
        run: ruff check app scripts tests

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci-root-${{ github.run_id }}
          DB_NAME: wishindiary_test_db
        run: python -m pytest

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Wishindiary-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Build Web Dist
        run: npm run build
