name: WishinDiary CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-${{ github.run_id }}
          MYSQL_DATABASE: wishindiary_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: ./wishindiary-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Backend import smoke test
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci-root-${{ github.run_id }}
          DB_NAME: wishindiary_test_db
        run: python -c "from app.main import app; print(app.title)"

      - name: Lint backend
        run: ruff check app scripts tests

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Run Pytest
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ci-root-${{ github.run_id }}
          DB_NAME: wishindiary_test_db
        run: python -m pytest

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: wishindiary-api/coverage.xml
          retention-days: 14

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./Wishindiary-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Audit Frontend Dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Type Check (vue-tsc)
        run: npm run type-check

      - name: Format Check
        run: npm run format:check

      - name: Unit Tests (Vitest)
        run: npm run test

      - name: Build Web Dist (includes vue-tsc type check)
        run: npm run build

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-e2e-${{ github.run_id }}
          MYSQL_DATABASE: wishindiary_e2e_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-e2e-${{ github.run_id }}
      DB_NAME: wishindiary_e2e_db
      ENVIRONMENT: development
      SECRET_KEY: ci-e2e-secret-key-hJ8kLm2pQw9xZv5nRfT3yUd6GaB7sCe1
      CORS_ORIGINS: http://localhost:4173,http://127.0.0.1:4173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./wishindiary-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Run DB Migrations
        working-directory: ./wishindiary-api
        run: alembic upgrade head

      - name: Start Backend API
        working-directory: ./wishindiary-api
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "started pid $!"

      - name: Wait for Backend Readiness
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo "backend ready"; exit 0; fi
            sleep 2
          done
          echo "backend failed to start"
          cat /tmp/uvicorn.log
          exit 1

      - name: Install Frontend Dependencies
        working-directory: ./Wishindiary-web
        run: npm ci

      - name: Build Frontend
        working-directory: ./Wishindiary-web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: ./Wishindiary-web
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: ./Wishindiary-web
        run: npm run e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Wishindiary-web/playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan (Trivy + SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          skip-dirs: |
            .git
            .venv
            .model-venv
            .idea
            .pytest_cache
            .npm-cache
            .pnpm-store
            Wishindiary-web/node_modules
            Wishindiary-web/dist

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0.17.4
        with:
          path: ./
          format: spdx
          output-file: sbom.spdx.json
          artifact-name: sbom
