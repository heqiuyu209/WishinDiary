# Alembic 数据库迁移配置。
#
# sqlalchemy.url 允许留空：migrations/env.py 会优先读取本配置中的 URL，
# 若为空则从 app.core.config.settings（环境变量 / .env）自动构建，
# 从而在本地开发、pytest 测试、Docker 部署三处复用同一套配置。

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# file_template = %%(rev)s_%%(slug)s
# timezone = UTC
# version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
